
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #C8B6E2, #B9DDF5);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .todo-card {
            background: white;
            border: none;
            border-radius: 20px;
        }

        .title {
            color: #8064A2;
            font-weight: bold;
        }

        .btn-tambah {
            background: #A88BC9;
            color: white;
            border: none;
        }

        .btn-tambah:hover {
            background: #896BAF;
            color: white;
        }

        .list-group-item {
            border: 1px solid #E5DDF0;
            border-radius: 10px !important;
            margin-bottom: 10px;
            padding: 13px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .task-done {
            text-decoration: line-through;
            color: #999;
        }

        .btn-edit {
            background: #B9DDF5;
            color: #345D78;
        }

        .btn-delete {
            background: #F5D6E8;
            color: #A33D70;
        }

        .empty-text {
            color: #999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card todo-card shadow-lg">
                    <div class="card-body p-4">

                        <h2 class="title text-center mb-2">
                            My To-Do List
                        </h2>

                        <p class="text-muted text-center mb-4">
                            Organize your day, one task at a time.
                        </p>

                        <div class="input-group mb-4">
                            <input
                                type="text"
                                id="inputTugas"
                                class="form-control"
                                placeholder="Masukkan tugas baru..."
                            >

                            <button
                                class="btn btn-tambah px-4"
                                id="btnTambah"
                            >
                                + Tambah
                            </button>
                        </div>

                        <div id="areaArray">
                            <p class="empty-text">Belum ada tugas.</p>
                        </div>

                    </div>
                </div>

                <p class="text-center text-white mt-3">
                    By Kelompok 6
                </p>

            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
